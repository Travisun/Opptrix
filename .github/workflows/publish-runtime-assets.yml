# Publish Opptrix runtime hot-update assets to CDN (R2), GitHub Release, and Gitee
# Triggers: push tag runtime-v*  or  workflow_dispatch
# Docker base images: publish-selfhost-image.yml (manual only).
#
# Assets (per linux-x64 / linux-arm64 native build):
#   opptrix-runtime-linux-{x64|arm64}-vX.Y.Z.bin + .sha256   (CDN primary per arch)
#   opptrix-runtime-vX.Y.Z.bin + .sha256                     (legacy x64 alias)
#   opptrix-runtime-vX.Y.Z.tar.gz (+ .sha256)
#   opptrix-runtime-linux-{x64|arm64}-vX.Y.Z.tar.gz (+ .sha256)
#
# Runtime semver (from runtime-v*) may differ from base (opptrix-selfhost-v*).
# Pack minBaseImage still comes from OPPTRIX_RELEASE_TAG / OPPTRIX_MIN_BASE_IMAGE
# (default: packages/selfhost preferredAppTag).
#
# Matrix: pinned ubuntu-24.04 (x64) + QEMU arm64 pack (see ci-selfhost-release.yml).
name: Publish runtime assets

on:
  push:
    tags:
      - 'runtime-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Runtime tag or version (e.g. runtime-v1.4.0 or 1.4.0)'
        required: true
        type: string
      min_base_image:
        description: 'Required Docker base (opptrix-selfhost-vX.Y.Z); empty = preferredAppTag after checkout'
        required: false
        type: string
        default: ''
      skip_gitee:
        description: 'Skip Gitee upload attempt'
        type: boolean
        default: false
      skip_r2:
        description: 'Skip R2/CDN sync (local/fork testing)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-runtime-assets-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with scripts/lib/ci-pins.env
  CI_UBUNTU_RUNNER: ubuntu-24.04
  OPPTRIX_NODE_PATCH_VERSION: '24.11.1'
  OPPTRIX_UPDATE_CDN_BASE: 'https://update.opptrix.org'

jobs:
  resolve-meta:
    name: Resolve version
    runs-on: ubuntu-24.04  # pin: scripts/lib/ci-pins.env CI_UBUNTU_RUNNER
    outputs:
      git_ref: ${{ steps.meta.outputs.git_ref }}
      version: ${{ steps.meta.outputs.version }}
      runtime_release_tag: ${{ steps.meta.outputs.runtime_release_tag }}
      min_base_image_input: ${{ steps.meta.outputs.min_base_image_input }}
    steps:
      - name: Resolve version tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          RAW="${RAW#refs/tags/}"
          MIN_IN="${{ github.event_name == 'workflow_dispatch' && inputs.min_base_image || '' }}"
          if [[ "$RAW" == runtime-v* ]]; then
            VERSION="${RAW#runtime-v}"
            GIT_REF="runtime-v${VERSION}"
          elif [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            VERSION="$RAW"
            GIT_REF="runtime-v${VERSION}"
          else
            echo "::error::Invalid tag '${RAW}'. Expect runtime-vX.Y.Z or X.Y.Z"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::Invalid semver in '${GIT_REF}'"
            exit 1
          fi
          echo "git_ref=${GIT_REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "runtime_release_tag=${GIT_REF}" >> "$GITHUB_OUTPUT"
          echo "min_base_image_input=${MIN_IN}" >> "$GITHUB_OUTPUT"
          echo "Resolved GIT_REF=${GIT_REF} VERSION=${VERSION} min_base_input=${MIN_IN:-"(preferredAppTag)"}"

  resolve-base:
    name: Resolve minBaseImage
    needs: resolve-meta
    runs-on: ubuntu-24.04  # pin: scripts/lib/ci-pins.env CI_UBUNTU_RUNNER
    outputs:
      min_base_image: ${{ steps.base.outputs.min_base_image }}
    steps:
      - name: Checkout runtime tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-meta.outputs.git_ref }}
          fetch-depth: 1

      - name: Resolve required Docker base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          MIN="${{ needs.resolve-meta.outputs.min_base_image_input }}"
          if [[ -z "${MIN}" ]]; then
            MIN="$(node -e "const p=require('./packages/selfhost/package.json'); const t=p.opptrixSelfhost&&p.opptrixSelfhost.preferredAppTag; if(!t) process.exit(2); process.stdout.write(String(t).trim())")"
          fi
          if [[ "$MIN" != opptrix-selfhost-v* ]]; then
            if [[ "$MIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
              MIN="opptrix-selfhost-v${MIN}"
            else
              echo "::error::min_base_image must be opptrix-selfhost-vX.Y.Z (got ${MIN})"
              exit 1
            fi
          fi
          echo "min_base_image=${MIN}" >> "$GITHUB_OUTPUT"
          echo "Using minBaseImage=${MIN} for runtime ${{ needs.resolve-meta.outputs.version }}"

  pack:
    name: Pack runtime (${{ matrix.platform_key }})
    needs: [resolve-meta, resolve-base]
    runs-on: ubuntu-24.04  # pin: scripts/lib/ci-pins.env CI_UBUNTU_RUNNER
    timeout-minutes: ${{ matrix.platform_key == 'linux-arm64' && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        platform_key: [linux-x64, linux-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-meta.outputs.git_ref }}
          fetch-depth: 1

      - name: Load CI pin config
        run: grep -v '^#' scripts/lib/ci-pins.env | grep -v '^$' >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
        if: matrix.platform_key == 'linux-arm64'

      - name: Setup Node.js
        if: matrix.platform_key == 'linux-x64'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.OPPTRIX_NODE_PATCH_VERSION }}
          cache: npm

      - name: Install build tools (native modules)
        if: matrix.platform_key == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 make g++ build-essential pkg-config

      - name: Install dependencies
        if: matrix.platform_key == 'linux-x64'
        run: npm ci

      - name: Build monorepo
        if: matrix.platform_key == 'linux-x64'
        run: npm run build

      - name: Prune devDependencies
        if: matrix.platform_key == 'linux-x64'
        run: npm prune --omit=dev

      - name: Pack runtime tarball (linux-x64)
        if: matrix.platform_key == 'linux-x64'
        env:
          OPPTRIX_APP_VERSION: ${{ needs.resolve-meta.outputs.version }}
          OPPTRIX_RELEASE_TAG: ${{ needs.resolve-base.outputs.min_base_image }}
          OPPTRIX_MIN_BASE_IMAGE: ${{ needs.resolve-base.outputs.min_base_image }}
          OPPTRIX_PACK_ASSERT_NO_ABI: '1'
        run: |
          set -euo pipefail
          node scripts/materialize-vendor.mjs --app "$PWD" --vendor /tmp/opptrix-pack-vendor/node_modules
          node scripts/pack-opptrix-runtime.mjs \
            --version "${{ needs.resolve-meta.outputs.version }}" \
            --platform-key linux-x64 \
            --out-dir dist-runtime \
            --also-platform-name \
            --assert-no-abi
          ls -lah dist-runtime/

      - name: Pack runtime tarball (linux-arm64 via QEMU)
        if: matrix.platform_key == 'linux-arm64'
        env:
          RUNTIME_CI_VERSION: ${{ needs.resolve-meta.outputs.version }}
          OPPTRIX_RELEASE_TAG: ${{ needs.resolve-base.outputs.min_base_image }}
          OPPTRIX_MIN_BASE_IMAGE: ${{ needs.resolve-base.outputs.min_base_image }}
          OPPTRIX_PACK_ASSERT_NO_ABI: '1'
          OPPTRIX_CI_ARM64_IMAGE: ${{ env.CI_NODE_BOOKWORM_IMAGE }}
          OPPTRIX_CI_ARM64_MODE: publish
        run: |
          set -euo pipefail
          bash scripts/ci-runtime-pack-arm64-docker.sh
          ls -lah dist-runtime/

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-pack-${{ matrix.platform_key }}
          path: dist-runtime/
          if-no-files-found: error

  publish:
    name: Publish runtime & upload release assets
    needs: [resolve-meta, resolve-base, pack]
    runs-on: ubuntu-24.04  # pin: scripts/lib/ci-pins.env CI_UBUNTU_RUNNER
    timeout-minutes: 30
    env:
      HAS_R2_CREDS: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    steps:
      - name: Require R2 secrets (tag push)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${{ secrets.R2_ACCOUNT_ID }}" ]]; then
            echo "::error::Missing GitHub secret R2_ACCOUNT_ID — required for tag push CDN publish"
            missing=1
          fi
          if [[ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ]]; then
            echo "::error::Missing GitHub secret R2_ACCESS_KEY_ID — required for tag push CDN publish"
            missing=1
          fi
          if [[ -z "${{ secrets.R2_SECRET_ACCESS_KEY }}" ]]; then
            echo "::error::Missing GitHub secret R2_SECRET_ACCESS_KEY — required for tag push CDN publish"
            missing=1
          fi
          if [[ -z "${{ secrets.R2_BUCKET }}" ]]; then
            echo "::error::Missing GitHub secret R2_BUCKET — required for tag push CDN publish"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then exit 1; fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-meta.outputs.git_ref }}
          fetch-depth: 1

      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge dist-runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-runtime
          cp -v artifacts/runtime-pack-linux-x64/* dist-runtime/
          cp -v artifacts/runtime-pack-linux-arm64/* dist-runtime/
          ls -lah dist-runtime/

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-meta.outputs.runtime_release_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Opptrix runtime hot-update ${{ needs.resolve-meta.outputs.version }} (linux-x64 + linux-arm64). Requires base ${{ needs.resolve-base.outputs.min_base_image }}." \
              --verify-tag
          fi

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-meta.outputs.runtime_release_tag }}"
          shopt -s nullglob
          files=(dist-runtime/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No files in dist-runtime"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Install R2 upload client
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_r2) && env.HAS_R2_CREDS == 'true' }}
        run: npm install @aws-sdk/client-s3@^3.888.0 --no-save --no-fund --no-audit

      - name: Sync hot assets to R2 (CDN)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_r2) && env.HAS_R2_CREDS == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPPTRIX_UPDATE_CDN_BASE: ${{ env.OPPTRIX_UPDATE_CDN_BASE }}
          OPPTRIX_RELEASE_TAG: ${{ needs.resolve-base.outputs.min_base_image }}
          OPPTRIX_MIN_BASE_IMAGE: ${{ needs.resolve-base.outputs.min_base_image }}
          OPPTRIX_RUNTIME_RELEASE_TAG: ${{ needs.resolve-meta.outputs.runtime_release_tag }}
        run: |
          set -euo pipefail
          node scripts/sync-hot-to-r2.mjs \
            --dir dist-runtime \
            --version "${{ needs.resolve-meta.outputs.version }}"

      - name: Note skipped R2 sync
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_r2) || env.HAS_R2_CREDS != 'true' }}
        shell: bash
        run: |
          echo "::warning::R2/CDN sync skipped (fork/manual without secrets or skip_r2=true)"

      - name: Purge hot CDN cache (optional)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_r2) && env.HAS_R2_CREDS == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          OPPTRIX_UPDATE_CDN_BASE: ${{ env.OPPTRIX_UPDATE_CDN_BASE }}
          OPPTRIX_APP_VERSION: ${{ needs.resolve-meta.outputs.version }}
        run: node scripts/purge-hot-cdn-cache.mjs --version "${{ needs.resolve-meta.outputs.version }}"

      - name: Mirror to Gitee (optional)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_gitee) }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          OPPTRIX_UPDATE_GITEE_REPO: Travisun/Opptrix
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ -n "${GITEE_TOKEN:-}" ]]; then
            EXTRA="--require-token"
          fi
          node scripts/upload-runtime-gitee.mjs \
            --version "${{ needs.resolve-meta.outputs.version }}" \
            --dir dist-runtime \
            --tag "${{ needs.resolve-meta.outputs.runtime_release_tag }}" \
            $EXTRA

      - name: Smoke verify CDN check-update
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_r2) && env.HAS_R2_CREDS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${OPPTRIX_UPDATE_CDN_BASE}/hot/check-update"
          VER="${{ needs.resolve-meta.outputs.version }}"
          echo "Fetching ${URL} …"
          if ! BODY="$(curl -fsS --max-time 30 "$URL")"; then
            echo "::warning::CDN check-update fetch failed (may need cache purge propagation)"
            exit 0
          fi
          echo "$BODY" | node -e "
            const v = process.argv[1];
            let j;
            try { j = JSON.parse(require('fs').readFileSync(0, 'utf8')); }
            catch (e) { console.error('invalid JSON'); process.exit(1); }
            if (!j.latest || j.latest.version !== v) {
              console.error('latest.version mismatch:', j.latest?.version, 'expected', v);
              process.exit(1);
            }
            const pkgs = j.latest.packages || {};
            for (const key of ['linux-x64', 'linux-arm64']) {
              const p = pkgs[key];
              if (!p || !String(p.bin || '').includes('opptrix-runtime-' + key + '-v' + v + '.bin')) {
                console.error('latest.packages.' + key + ' missing or unexpected');
                process.exit(1);
              }
            }
            if (!String(j.latest.bin || '').includes('opptrix-runtime-v' + v + '.bin')) {
              console.error('latest.bin legacy x64 URL unexpected');
              process.exit(1);
            }
            if (!j.retention || j.retention.max !== 8) {
              console.error('retention.max missing or not 8');
              process.exit(1);
            }
            if (!Array.isArray(j.releases) || j.releases.length < 1) {
              console.error('releases[] missing or empty');
              process.exit(1);
            }
            const first = j.releases[0];
            if (!first.description || !Array.isArray(first.description.features)) {
              console.error('releases[0].description missing');
              process.exit(1);
            }
            console.log('CDN check-update OK for', v, '(linux-x64 + linux-arm64 + releases)');
          " "$VER"

      - name: Summarize
        shell: bash
        run: |
          VER="${{ needs.resolve-meta.outputs.version }}"
          TAG="${{ needs.resolve-meta.outputs.runtime_release_tag }}"
          BASE_IMG="${{ needs.resolve-base.outputs.min_base_image }}"
          BASE="${OPPTRIX_UPDATE_CDN_BASE}"
          {
            echo "### Runtime assets"
            echo "- Runtime tag: \`${TAG}\`"
            echo "- minBaseImage: \`${BASE_IMG}\`"
            echo "- CDN: \`${BASE}/hot/check-update\` → \`linux-x64\` + \`linux-arm64\` packages"
            echo "- GitHub Release: per-arch \`.bin\`, legacy x64 alias, \`.tar.gz\`"
            echo "- Gitee mirror: same set when \`GITEE_TOKEN\` configured"
            echo "- Docs: \`docs/SYSTEM-UPDATE.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
