name: Resync Desktop FTP

# Re-upload installers from a prior Release Desktop Actions artifact to FTP
# without rebuilding. Use after fixing sync scripts, or when the FTP mirror is missing assets.
# (Formerly Resync Desktop R2 — distribution is FTP-only.)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. desktop-v1.2.6)
        required: true
        type: string
      run_id:
        description: Optional Release Desktop run id (overrides tag lookup)
        required: false
        type: string
        default: ''

concurrency:
  group: resync-desktop-ftp-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  sync-ftp:
    name: Sync release to FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata policy
        run: node apps/desktop/scripts/verify-release-metadata-policy.mjs

      - name: Download desktop-release-bundle artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          RUN_ID="${{ inputs.run_id }}"
          if [[ ! "$TAG" =~ ^desktop-v ]]; then
            echo "tag must start with desktop-v (got: $TAG)"
            exit 1
          fi

          if [[ -z "$RUN_ID" ]]; then
            echo "Looking up successful Release Desktop run for $TAG…"
            RUN_ID="$(gh run list \
              --workflow=release-desktop.yml \
              --status=success \
              --limit=100 \
              --json databaseId,displayTitle,headBranch \
              | jq -r --arg tag "$TAG" '
                [.[] | select(
                  .headBranch == $tag
                  or (.displayTitle | contains($tag))
                )] | .[0].databaseId // empty
              ')"
          fi

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::No successful Release Desktop run found for $TAG with artifact desktop-release-bundle."
            echo "Re-run workflow Release Desktop for this tag, or pass run_id explicitly."
            exit 1
          fi

          echo "Using run_id=$RUN_ID"
          WORK="$RUNNER_TEMP/ftp-sync"
          mkdir -p "$WORK"
          if ! gh run download "$RUN_ID" -n desktop-release-bundle -D "$WORK"; then
            echo "::error::Failed to download artifact desktop-release-bundle from run $RUN_ID."
            echo "Artifact may have expired (~14 days) or the run predates this pipeline."
            echo "Re-run Release Desktop for $TAG, or pass a run_id that still has the bundle."
            exit 1
          fi

          echo "ASSET_DIR=$WORK" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ls -la "$WORK"
          echo "--- cms signatures ---"
          ls -la "$WORK"/*.opptrix-cms 2>/dev/null || echo "(none in bundle — Linux CMS will stay optional)"

      - name: Verify release coherence (tag, yml, assets)
        run: node apps/desktop/scripts/verify-release-coherence.mjs "$TAG" "$ASSET_DIR"

      - name: Sync to FTP (upload then prune obsolete)
        id: sync_ftp
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          OPPTRIX_UPDATE_BASE_URL: ${{ secrets.OPPTRIX_UPDATE_BASE_URL }}
        run: node apps/desktop/scripts/sync-release-to-ftp.mjs "$ASSET_DIR"

      - name: Require FTP_HOST
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_OUTCOME: ${{ steps.sync_ftp.outcome }}
        run: |
          if [[ -z "${FTP_HOST:-}" ]]; then
            echo "::error::FTP_HOST is required — desktop release distribution is FTP-only"
            exit 1
          fi
          if [[ "$FTP_OUTCOME" != "success" ]]; then
            echo "::error::FTP sync failed (outcome=$FTP_OUTCOME)"
            exit 1
          fi
          echo "FTP sync OK"
