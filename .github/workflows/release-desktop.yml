name: Release Desktop

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      skip_signing:
        description: Skip code signing (dev / unsigned build)
        type: boolean
        default: false

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Restricted permissions set omitted scopes to none — need Actions RW for
  # upload-artifact / download-artifact (installers no longer go to GH Release).
  actions: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPPTRIX_RELEASE_STRICT: '1'
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#desktop-v}"
          PRERELEASE_FLAG=""
          IS_DEV=0
          NOTES_FILE="$(mktemp)"
          if [[ "$TAG" == *-dev* ]]; then
            PRERELEASE_FLAG="--prerelease"
            IS_DEV=1
          fi

          node scripts/assemble-release-notes.mjs "$VERSION" > "$NOTES_FILE"

          # Notes-only GitHub Release. Do NOT upload installers / yml / blockmap / CMS.
          # User downloads: https://opptrix.org/  |  Auto-update feed: R2 (update.opptrix.org).
          # Formal tags (non *-dev*): published (non-draft). *-dev*: --prerelease, also non-draft.

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            IS_DRAFT="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo false)"
            echo "isDraft=$IS_DRAFT"
            EDIT_ARGS=(--notes-file "$NOTES_FILE")
            if [[ "$IS_DEV" -eq 0 && "$IS_DRAFT" == "true" ]]; then
              EDIT_ARGS+=(--draft=false)
            fi
            gh release edit "$TAG" "${EDIT_ARGS[@]}"
            exit 0
          fi

          gh release create "$TAG" \
            --title "Opptrix Desktop ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG

  # Download SenseVoice / e5 / RapidOCR once (arch-independent); matrix jobs only restore.
  stage-shared-models:
    name: Stage shared models
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache shared model assets
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/resources/llms/rapidocr-ppocrv4-mobile
            apps/desktop/resources/llms/multilingual-e5-small
            apps/desktop/resources/sensevoice
          key: desktop-shared-models-v1
          restore-keys: |
            desktop-shared-models-v1

      - name: Stage SenseVoice / e5 / RapidOCR (foreign-first)
        env:
          OPPTRIX_MODEL_SOURCE_ORDER: huggingface,modelscope
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
          OPPTRIX_RAPIDOCR_DIRECT_URL_PREFIX: ${{ secrets.OPPTRIX_RAPIDOCR_DIRECT_URL_PREFIX }}
        run: |
          node apps/desktop/scripts/stage-sensevoice.mjs
          node apps/desktop/scripts/stage-e5.mjs
          node apps/desktop/scripts/stage-rapidocr.mjs

      - name: Pack shared models for artifact
        shell: bash
        run: |
          STAGING="$RUNNER_TEMP/desktop-shared-models"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/llms"
          cp -a apps/desktop/resources/llms/rapidocr-ppocrv4-mobile "$STAGING/llms/"
          cp -a apps/desktop/resources/llms/multilingual-e5-small "$STAGING/llms/"
          cp -a apps/desktop/resources/sensevoice "$STAGING/"
          echo "Packed shared models into $STAGING"
          find "$STAGING" -maxdepth 3 -type d | head -40

      - name: Upload shared models artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shared-models
          path: ${{ runner.temp }}/desktop-shared-models
          retention-days: 7
          if-no-files-found: error

  release:
    name: ${{ matrix.label }}
    needs: [prepare-release, stage-shared-models]
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest is VS2026 / MSVC 14.51+; duckdb@1.4.x cannot compile there.
          - os: windows-2022
            label: Windows x64
            artifact: desktop-win-x64
          - os: ubuntu-latest
            label: Linux x64
            artifact: desktop-linux-x64
          - os: macos-latest
            label: macOS arm64
            electron_arch: arm64
            artifact: desktop-mac-arm64
          - os: macos-latest
            label: macOS x64
            electron_arch: x64
            artifact: desktop-mac-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # prebuild must not re-download shared models (restored from artifact below).
      OPPTRIX_SKIP_SHARED_MODEL_STAGE: '1'
      # Matrix arch for all steps (verify-packaged-runtime, stage-runtime, …).
      # Empty on Windows/Linux (no electron_arch) → resolveRuntimeTarget uses host arch.
      OPPTRIX_RUNTIME_ARCH: ${{ matrix.electron_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify desktop version matches tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          PKG_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag desktop-v$TAG_VERSION does not match apps/desktop/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Prepare UI fonts
        run: npm run prepare:fonts

      - name: Download shared models artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-shared-models
          path: apps/desktop/resources

      - name: Verify shared models restored
        shell: bash
        run: |
          test -d apps/desktop/resources/sensevoice
          test -d apps/desktop/resources/llms/multilingual-e5-small
          test -d apps/desktop/resources/llms/rapidocr-ppocrv4-mobile
          echo "Shared models present under apps/desktop/resources"

      # Writes resources/engines/<plat-arch>/MANIFEST.json for audit / prebuild compat (no pip download).
      # Cross mac-x64 on arm64 runners must set OPPTRIX_RUNTIME_ARCH so MANIFEST lands under darwin-x64.
      - name: Stage RAG engines MANIFEST (Node OCR)
        run: node apps/desktop/scripts/stage-rag-engines.mjs
        env:
          OPPTRIX_RUNTIME_ARCH: ${{ matrix.electron_arch }}

      # Stages build/icons including tray/* (audit requires full tray set; not produced by RAG stage scripts).
      - name: Stage desktop icons / tray
        run: node apps/desktop/scripts/prepare-icons.mjs

      # Fail early on Python download/materialize before signing / electron-builder.
      # stage-python needs agent-workspace dist; prebuild also stages again (idempotent reuse).
      - name: Build packages
        run: npm run build:packages

      - name: Stage bundled Python runtime
        run: node apps/desktop/scripts/stage-python.mjs
        env:
          OPPTRIX_RUNTIME_ARCH: ${{ matrix.electron_arch }}

      - name: Audit desktop packaging preflight
        shell: bash
        env:
          OPPTRIX_AUDIT_STAGE_UPDATER: '1'
          OPPTRIX_AUDIT_REQUIRE_STAGED_PYTHON: '1'
          OPPTRIX_RUNTIME_ARCH: ${{ matrix.electron_arch }}
          # Tag releases always require Opptrix or commercial Win CSC;
          # workflow_dispatch + skip_signing=true may ship unsigned.
          OPPTRIX_AUDIT_REQUIRE_SIGN_SECRETS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_signing == true && '0' || '1' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          OPPTRIX_CODE_SIGNING_P12: ${{ secrets.OPPTRIX_CODE_SIGNING_P12 }}
        run: node apps/desktop/scripts/audit-desktop-pack.mjs

      - name: Verify release metadata policy
        run: node apps/desktop/scripts/verify-release-metadata-policy.mjs

      - name: Configure code signing
        id: signcfg
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          OPPTRIX_CODE_SIGNING_P12: ${{ secrets.OPPTRIX_CODE_SIGNING_P12 }}
          OPPTRIX_CODE_SIGNING_P12_PASSWORD: ${{ secrets.OPPTRIX_CODE_SIGNING_P12_PASSWORD }}
        run: |
          if [[ "${{ inputs.skip_signing }}" == "true" ]]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "skip_signing input — unsigned build"
            exit 0
          fi

          case "${{ runner.os }}" in
            macOS)
              if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
                echo "mode=unsigned" >> "$GITHUB_OUTPUT"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
                echo "::warning::CSC_LINK or CSC_KEY_PASSWORD missing — ad-hoc macOS build"
                exit 0
              fi

              KC="$RUNNER_TEMP/opptrix-signing.keychain-db"
              KC_PASS="ci-${{ github.run_id }}-${{ github.run_attempt }}"
              CERT="$RUNNER_TEMP/opptrix-cert.p12"
              echo "$CSC_LINK" | base64 --decode > "$CERT" 2>/dev/null || echo "$CSC_LINK" | base64 -D > "$CERT"

              security delete-keychain "$KC" 2>/dev/null || true
              security create-keychain -p "$KC_PASS" "$KC"
              security default-keychain -s "$KC"
              security unlock-keychain -p "$KC_PASS" "$KC"
              security set-keychain-settings -t 3600 -u "$KC"
              security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/^[[:space:]]*"\(.*\)"[[:space:]]*$/\1/')

              if security import "$CERT" -k "$KC" -P "$CSC_KEY_PASSWORD" \
                  -A -T /usr/bin/codesign -T /usr/bin/productbuild 2>/dev/null; then
                # Headless CI: codesign must access the private key without a GUI prompt (errSecUserCanceled).
                security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
                echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"
                echo "MACOS_KEYCHAIN_PASSWORD=$KC_PASS" >> "$GITHUB_ENV"
                echo "mode=mac" >> "$GITHUB_OUTPUT"
                echo "macOS Developer ID signing enabled (headless keychain ready)"
                security find-identity -v -p codesigning "$KC"
              else
                echo "mode=unsigned" >> "$GITHUB_OUTPUT"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
                echo "::warning::CSC_KEY_PASSWORD does not match CSC_LINK (.p12) — ad-hoc macOS build. Fix GitHub Secrets and rebuild for signed/notarized packages."
                security delete-keychain "$KC" 2>/dev/null || true
              fi
              rm -f "$CERT"
              ;;
            Windows)
              # Prefer commercial WIN_CSC_*; else Opptrix self-issued update cert (custom client verifier).
              if [ -z "${WIN_CSC_LINK:-}" ] && [ -n "${OPPTRIX_CODE_SIGNING_P12:-}" ]; then
                export WIN_CSC_LINK="$OPPTRIX_CODE_SIGNING_P12"
                export WIN_CSC_KEY_PASSWORD="${OPPTRIX_CODE_SIGNING_P12_PASSWORD:-}"
                echo "WIN_CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
                echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
                echo "Using OPPTRIX_CODE_SIGNING_P12 as Windows Authenticode identity (self-issued)"
              fi
              if [ -n "${WIN_CSC_LINK:-}" ]; then
                echo "mode=win" >> "$GITHUB_OUTPUT"
                echo "Windows code signing enabled"
              else
                echo "mode=unsigned" >> "$GITHUB_OUTPUT"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
                echo "::warning::WIN_CSC_LINK / OPPTRIX_CODE_SIGNING_P12 not configured — unsigned Windows build"
              fi
              ;;
            Linux)
              if [ -n "${OPPTRIX_CODE_SIGNING_P12:-}" ]; then
                echo "mode=linux-cms" >> "$GITHUB_OUTPUT"
                echo "Linux CMS update signing material available"
              else
                echo "mode=unsigned" >> "$GITHUB_OUTPUT"
                echo "::warning::OPPTRIX_CODE_SIGNING_P12 not configured — Linux CMS update signatures will be skipped"
              fi
              ;;
            *)
              echo "mode=unsigned" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build desktop package
        shell: bash
        env:
          OPPTRIX_UPDATE_BASE_URL: ${{ secrets.OPPTRIX_UPDATE_BASE_URL }}
          SIGN_MODE: ${{ steps.signcfg.outputs.mode }}
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          OPPTRIX_CODE_SIGNING_P12_SECRET: ${{ secrets.OPPTRIX_CODE_SIGNING_P12 }}
          OPPTRIX_CODE_SIGNING_P12_PASSWORD_SECRET: ${{ secrets.OPPTRIX_CODE_SIGNING_P12_PASSWORD }}
          OPPTRIX_CODE_SIGNING_KEY_PEM_SECRET: ${{ secrets.OPPTRIX_CODE_SIGNING_KEY_PEM }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          OPPTRIX_RUNTIME_ARCH: ${{ matrix.electron_arch }}
        run: |
          # codesign deep-scan of runtime-stage/node_modules needs high FD limit (EMFILE).
          # Soft-only (`ulimit -S -n`) — bare `ulimit -n N` also clamps hard (unlimited→N).
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "macOS FD limits before raise: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
            RAISED=0
            for TARGET in 1048576 524288 131072 65536; do
              if ulimit -S -n "$TARGET" 2>/dev/null; then
                echo "macOS FD soft raised to $TARGET"
                RAISED=1
                break
              fi
            done
            if [[ "$RAISED" -ne 1 ]]; then
              echo "::error::Failed to raise soft ulimit -S -n (tried 1048576→65536)"
              exit 1
            fi
            SOFT="$(ulimit -Sn)"
            HARD="$(ulimit -Hn)"
            echo "macOS FD limits after raise: soft=$SOFT hard=$HARD"
            if [[ "$SOFT" != "unlimited" && "$SOFT" -lt 20000 ]]; then
              echo "::error::ulimit -n soft ($SOFT) still below 20000 after raise"
              exit 1
            fi
          fi

          if [[ "${{ runner.os }}" == "macOS" && -n "${CSC_KEYCHAIN:-}" ]]; then
            cleanup_signing_keychain() {
              security delete-keychain "$CSC_KEYCHAIN" 2>/dev/null || true
              echo "Cleaned up signing keychain: $CSC_KEYCHAIN"
            }
            trap cleanup_signing_keychain EXIT
          fi

          case "$SIGN_MODE" in
            mac)
              # Certificate already imported in Configure step; reuse CSC_KEYCHAIN (do not pass CSC_LINK — electron-builder would recreate a temp keychain without headless ACL).
              security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
              export APPLE_ID="$APPLE_ID_SECRET"
              export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
              export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
              ;;
            win)
              if [ -n "${WIN_CSC_LINK_SECRET:-}" ]; then
                export WIN_CSC_LINK="$WIN_CSC_LINK_SECRET"
                export WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_SECRET"
              else
                export WIN_CSC_LINK="$OPPTRIX_CODE_SIGNING_P12_SECRET"
                export WIN_CSC_KEY_PASSWORD="$OPPTRIX_CODE_SIGNING_P12_PASSWORD_SECRET"
              fi
              ;;
            linux-cms)
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
              if [ -n "${OPPTRIX_CODE_SIGNING_KEY_PEM_SECRET:-}" ]; then
                export OPPTRIX_CODE_SIGNING_KEY_PEM="$OPPTRIX_CODE_SIGNING_KEY_PEM_SECRET"
              elif [ -n "${OPPTRIX_CODE_SIGNING_P12_SECRET:-}" ]; then
                mkdir -p apps/desktop/.secrets
                P12="$RUNNER_TEMP/opptrix-cms.p12"
                echo "$OPPTRIX_CODE_SIGNING_P12_SECRET" | base64 --decode > "$P12"
                openssl pkcs12 -in "$P12" -nocerts -nodes \
                  -passin pass:"$OPPTRIX_CODE_SIGNING_P12_PASSWORD_SECRET" \
                  -out apps/desktop/.secrets/opptrix-code-signing.key
                rm -f "$P12"
              fi
              ;;
            *)
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              if [[ "${{ runner.os }}" == "macOS" ]]; then
                export OPPTRIX_MAC_UNSIGNED=1
              fi
              ;;
          esac

          case "${{ matrix.electron_arch }}" in
            arm64) npm run build:package:mac-arm64 -w @opptrix/desktop ;;
            x64)   npm run build:package:mac-x64 -w @opptrix/desktop ;;
            *)     npm run build:package -w @opptrix/desktop ;;
          esac

      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS' && env.CSC_KEYCHAIN != ''
        run: |
          security delete-keychain "$CSC_KEYCHAIN" 2>/dev/null || true
          echo "Cleaned up signing keychain: $CSC_KEYCHAIN"

      - name: Verify update metadata matches built files
        shell: bash
        run: node apps/desktop/scripts/verify-release-artifacts.mjs apps/desktop/release

      - name: Verify electron-updater is bundled in app
        shell: bash
        run: node apps/desktop/scripts/verify-packaged-updater.mjs apps/desktop/release

      - name: Verify sidecar runtime deps are bundled
        shell: bash
        run: node apps/desktop/scripts/verify-packaged-runtime.mjs apps/desktop/release

      - name: Sign Linux update artifacts (CMS)
        if: runner.os == 'Linux' && steps.signcfg.outputs.mode == 'linux-cms'
        shell: bash
        env:
          OPPTRIX_CODE_SIGNING_KEY_PEM: ${{ secrets.OPPTRIX_CODE_SIGNING_KEY_PEM }}
          OPPTRIX_CODE_SIGNING_P12: ${{ secrets.OPPTRIX_CODE_SIGNING_P12 }}
          OPPTRIX_CODE_SIGNING_P12_PASSWORD: ${{ secrets.OPPTRIX_CODE_SIGNING_P12_PASSWORD }}
        run: |
          mkdir -p apps/desktop/.secrets
          if [ -n "${OPPTRIX_CODE_SIGNING_KEY_PEM:-}" ]; then
            printf '%s\n' "$OPPTRIX_CODE_SIGNING_KEY_PEM" > apps/desktop/.secrets/opptrix-code-signing.key
          elif [ -n "${OPPTRIX_CODE_SIGNING_P12:-}" ]; then
            P12="$RUNNER_TEMP/opptrix-cms.p12"
            echo "$OPPTRIX_CODE_SIGNING_P12" | base64 --decode > "$P12"
            openssl pkcs12 -in "$P12" -nocerts -nodes \
              -passin pass:"$OPPTRIX_CODE_SIGNING_P12_PASSWORD" \
              -out apps/desktop/.secrets/opptrix-code-signing.key
            rm -f "$P12"
          fi
          node apps/desktop/scripts/sign-update-artifact.mjs apps/desktop/release

      - name: Stage release artifacts for Actions
        shell: bash
        run: |
          RELEASE_DIR="apps/desktop/release"
          STAGING="apps/desktop/release-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          if [[ "${{ runner.os }}" == "macOS" && -n "${{ matrix.electron_arch }}" ]]; then
            if [[ -f "$RELEASE_DIR/latest-mac.yml" ]]; then
              mv "$RELEASE_DIR/latest-mac.yml" "$RELEASE_DIR/latest-mac-${{ matrix.electron_arch }}.yml"
              echo "Renamed latest-mac.yml → latest-mac-${{ matrix.electron_arch }}.yml (merged later in finalize job)"
            fi
          fi

          files=()
          while IFS= read -r file; do
            [ -n "$file" ] && files+=("$file")
          done < <(find "$RELEASE_DIR" -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o \
            -name '*.AppImage' -o -name '*.deb' -o -name 'latest*.yml' -o -name '*.blockmap' -o \
            -name '*.opptrix-cms' \
          \) ! -name 'latest-mac.yml')

          if [ ${#files[@]} -eq 0 ]; then
            echo "No distributable artifacts under $RELEASE_DIR"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi

          echo "Staging ${#files[@]} file(s) for artifact ${{ matrix.artifact }}:"
          printf '  - %s\n' "${files[@]}"
          cp "${files[@]}" "$STAGING/"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/release-staging/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  finalize-release:
    name: Finalize macOS update metadata
    needs: release
    runs-on: ubuntu-latest
    if: ${{ needs.release.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata policy
        run: node apps/desktop/scripts/verify-release-metadata-policy.mjs

      - name: Download Windows platform artifact
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-win-*
          path: ${{ runner.temp }}/desktop-bundle
          merge-multiple: true

      - name: Download Linux platform artifact
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-linux-*
          path: ${{ runner.temp }}/desktop-bundle
          merge-multiple: true

      - name: Download macOS platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-mac-*
          path: ${{ runner.temp }}/desktop-bundle
          merge-multiple: true

      - name: Merge latest-mac.yml and verify asset list
        shell: bash
        run: |
          WORK="${{ runner.temp }}/desktop-bundle"
          ls -la "$WORK"

          if [[ ! -f "$WORK/latest-mac-arm64.yml" ]]; then
            echo "::error::Missing latest-mac-arm64.yml in platform artifacts"
            exit 1
          fi
          if [[ ! -f "$WORK/latest-mac-x64.yml" ]]; then
            echo "::error::Missing latest-mac-x64.yml in platform artifacts"
            exit 1
          fi

          node apps/desktop/scripts/merge-mac-update-yml.mjs \
            "$WORK/latest-mac-arm64.yml" \
            "$WORK/latest-mac-x64.yml" \
            "$WORK/latest-mac.yml"

          # Local asset name list (verify-release-yml-on-github only checks names).
          ASSET_LIST="$RUNNER_TEMP/release-assets.txt"
          find "$WORK" -maxdepth 1 -type f -printf '%f\n' | sort > "$ASSET_LIST"
          echo "Bundle assets:"
          cat "$ASSET_LIST"

          node apps/desktop/scripts/verify-release-yml-on-github.mjs \
            "$WORK/latest-mac.yml" \
            "$ASSET_LIST"

          for yml in latest.yml latest-linux.yml; do
            if [[ -f "$WORK/$yml" ]]; then
              node apps/desktop/scripts/verify-release-yml-on-github.mjs \
                "$WORK/$yml" \
                "$ASSET_LIST"
            fi
          done

          # Do not upload installers/yml to GitHub Release — R2 is the distribution path.
          echo "ASSET_DIR=$WORK" >> "$GITHUB_ENV"
          echo "Merged latest-mac.yml into desktop-release-bundle staging"

      - name: Upload desktop-release-bundle
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-bundle
          path: ${{ env.ASSET_DIR }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  sync-r2:
    name: Sync release to Cloudflare R2
    needs: finalize-release
    runs-on: ubuntu-latest
    if: ${{ needs.finalize-release.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata policy
        run: node apps/desktop/scripts/verify-release-metadata-policy.mjs

      - name: Download desktop-release-bundle
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-bundle
          path: ${{ runner.temp }}/r2-sync

      - name: Set asset directory
        shell: bash
        run: |
          WORK="${{ runner.temp }}/r2-sync"
          echo "ASSET_DIR=$WORK" >> "$GITHUB_ENV"
          ls -la "$WORK"

      - name: Verify release coherence (tag, yml, assets)
        run: node apps/desktop/scripts/verify-release-coherence.mjs "${{ github.ref_name }}" "$ASSET_DIR"

      - name: Verify R2 credentials
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node apps/desktop/scripts/verify-r2-credentials.mjs

      - name: Sync to Cloudflare R2 (upload then prune obsolete)
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPPTRIX_UPDATE_BASE_URL: ${{ secrets.OPPTRIX_UPDATE_BASE_URL }}
        run: node apps/desktop/scripts/sync-release-to-r2.mjs "$ASSET_DIR"

      # Purge before public verify — edge may cache 404 from mid-upload probes.
      - name: Purge Cloudflare CDN cache (yml + Linux installers/CMS)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          OPPTRIX_UPDATE_BASE_URL: ${{ secrets.OPPTRIX_UPDATE_BASE_URL }}
          ASSET_DIR: ${{ env.ASSET_DIR }}
        run: node apps/desktop/scripts/purge-update-cdn-cache.mjs "$ASSET_DIR"

      - name: Verify public update metadata
        shell: bash
        env:
          OPPTRIX_UPDATE_BASE_URL: ${{ secrets.OPPTRIX_UPDATE_BASE_URL }}
        run: |
          if [[ -z "${OPPTRIX_UPDATE_BASE_URL:-}" ]]; then
            echo "OPPTRIX_UPDATE_BASE_URL not set — skip public verify"
            exit 0
          fi
          BASE="${OPPTRIX_UPDATE_BASE_URL%/}/"
          check_url() {
            local url="$1"
            local mode="${2:-full}" # full | range
            local attempt=1
            local max=8
            while (( attempt <= max )); do
              echo "Checking $url (attempt $attempt/$max)"
              if [[ "$mode" == "range" ]]; then
                if curl -fsSL --max-time 30 -r 0-0 --retry 2 --retry-delay 2 "$url" -o /dev/null; then
                  return 0
                fi
              else
                if curl -fsSL --max-time 30 --retry 2 --retry-delay 2 "$url" -o /dev/null; then
                  return 0
                fi
              fi
              sleep $(( attempt * 2 ))
              attempt=$(( attempt + 1 ))
            done
            echo "::error::Public CDN still unreachable: $url"
            echo "If R2 HeadObject passed but this fails, check Cloudflare WAF / custom domain rules for this extension."
            return 1
          }
          for yml in latest-mac.yml latest.yml latest-linux.yml; do
            check_url "${BASE}${yml}" full || exit 1
          done
          shopt -s nullglob
          for appimage in "$ASSET_DIR"/*-Linux.AppImage; do
            check_url "${BASE}$(basename "$appimage")" range || exit 1
          done
          for cms in "$ASSET_DIR"/*.opptrix-cms; do
            check_url "${BASE}$(basename "$cms")" full || exit 1
          done
          echo "Public update metadata (+ Linux AppImage/CMS if any) reachable on R2"

  sync-experts-r2:
    name: Sync experts to R2 (if changed)
    needs: sync-r2
    runs-on: ubuntu-latest
    if: ${{ needs.sync-r2.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect experts/ changes since previous desktop tag
        id: experts
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PREV="$(git tag -l 'desktop-v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          if [[ -z "$PREV" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous desktop tag — syncing experts/"
            exit 0
          fi
          if git diff --name-only "$PREV" "$TAG" -- experts/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "experts/ changed between $PREV and $TAG"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No experts/ changes between $PREV and $TAG — skip"
          fi

      - name: Validate experts JSON
        if: steps.experts.outputs.changed == 'true'
        run: node scripts/validate-experts.mjs

      - name: Sync experts to R2
        if: steps.experts.outputs.changed == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node apps/desktop/scripts/sync-experts-to-r2.mjs

      - name: Purge experts CDN cache
        if: steps.experts.outputs.changed == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          OPPTRIX_EXPERT_CATALOG_BASE_URL: https://update.opptrix.org/experts/
        run: node apps/desktop/scripts/purge-experts-cdn-cache.mjs
