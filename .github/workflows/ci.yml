name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with scripts/lib/ci-pins.env
  CI_UBUNTU_RUNNER: ubuntu-24.04

jobs:
  build-and-test:
    name: Build & test (server / selfhost)
    runs-on: ${{ env.CI_UBUNTU_RUNNER }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load CI pin config
        run: grep -v '^#' scripts/lib/ci-pins.env | grep -v '^$' >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.OPPTRIX_NODE_PATCH_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Build client UI
        run: npm run build -w opptrix-client

      - name: Run smoke and integration tests
        run: npm run test:ci
        env:
          CI: true
          OPPTRIX_CI_SKIP_DESKTOP_TESTS: '1'
