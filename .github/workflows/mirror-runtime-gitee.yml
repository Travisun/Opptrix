# Mirror existing GitHub runtime release assets to Gitee (no repack).
# Use this to validate Gitee upload fixes without re-running the full pack matrix.
name: Mirror runtime to Gitee

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Runtime tag or version (e.g. runtime-v1.4.4 or 1.4.4)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mirror-runtime-gitee-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to Gitee
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ inputs.tag }}"
          RAW="${RAW#refs/tags/}"
          if [[ "$RAW" == runtime-v* ]]; then
            VERSION="${RAW#runtime-v}"
            TAG="runtime-v${VERSION}"
          elif [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            VERSION="$RAW"
            TAG="runtime-v${VERSION}"
          else
            echo "::error::Invalid tag '${RAW}'. Expect runtime-vX.Y.Z or X.Y.Z"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "runtime_release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=${TAG} VERSION=${VERSION}"

      - name: Checkout (workflow ref — latest Gitee uploader)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.runtime_release_tag }}"
          mkdir -p dist-runtime
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir dist-runtime \
            --clobber
          ls -lah dist-runtime/

      - name: Mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          OPPTRIX_UPDATE_GITEE_REPO: Travisun/Opptrix
          OPPTRIX_UPDATE_GITEE_TARGET: main
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_TOKEN:-}" ]]; then
            echo "::error::GITEE_TOKEN secret is required for this workflow"
            exit 1
          fi
          node scripts/upload-runtime-gitee.mjs \
            --version "${{ steps.meta.outputs.version }}" \
            --dir dist-runtime \
            --tag "${{ steps.meta.outputs.runtime_release_tag }}" \
            --require-token
