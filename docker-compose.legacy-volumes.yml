# Legacy 3-volume self-host (pre unified /opptrix home).
# Prefer for existing named volumes opptrix-data / opptrix-models / opptrix-system:
#
#   docker compose -f docker-compose.legacy-volumes.yml up -d --build
#
# New installs should use docker-compose.yml (single opptrix-home volume).
# Dual-user DAC (opptrix-agent) still applies via the same image/entrypoint.

services:
  opptrix:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "${OPPTRIX_NODE_VERSION:-24}"
        NODE_IMAGE_PREFIX: "${OPPTRIX_DOCKER_IMAGE_PREFIX:-}"
        NPM_REGISTRY: "${OPPTRIX_NPM_REGISTRY:-}"
        APT_MIRROR: "${OPPTRIX_APT_MIRROR:-}"
        MIRROR_AUTO: "${OPPTRIX_MIRROR_AUTO_BUILD:-}"
        OPPTRIX_BASE_VERSION: "${OPPTRIX_BASE_VERSION:-}"
        OPPTRIX_RELEASE_TAG: "${OPPTRIX_RELEASE_TAG:-}"
    image: ${OPPTRIX_IMAGE:-opptrix:local}
    container_name: opptrix
    env_file:
      - path: compose.env
        required: false
    ports:
      - "127.0.0.1:8711:8711"
    environment:
      STOCK_RESEARCH_HOST: "0.0.0.0"
      STOCK_RESEARCH_PORT: "8711"
      SERVE_UI: "1"
      # Clear image default OPPTRIX_HOME → entrypoint legacy /data+/models+/system layout
      OPPTRIX_HOME: ""
      OPPTRIX_DATA_DIR: "/data"
      OPPTRIX_AGENT_WORKSPACE_DIR: "/data/agent-workspace"
      OPPTRIX_MOUNTS_DIR: "/data/mounts"
      OPPTRIX_SYSTEM_DIR: "/system"
      OPPTRIX_DOCKER: "1"
      OPPTRIX_AGENT_SANDBOX: "${OPPTRIX_AGENT_SANDBOX:-off}"
      OPPTRIX_AGENT_USER: "opptrix-agent"
      OPPTRIX_AGENT_UID: "10001"
      OPPTRIX_AGENT_GID: "10001"
      OPPTRIX_SEED_ROOT: "/app"
      OPPTRIX_MODELS_DIR: "/models"
      OPPTRIX_LLM_DIR: "/models/llms"
      OPPTRIX_E5_BUNDLED_DIR: "/models/llms/multilingual-e5-small"
      OPPTRIX_RAPIDOCR_MODEL_DIR: "/models/llms/rapidocr-ppocrv4-mobile"
      OPPTRIX_RAPIDOCR_BUNDLED_DIR: "/models/llms/rapidocr-ppocrv4-mobile"
      OPPTRIX_SENSEVOICE_BUNDLED_DIR: "/models/sensevoice"
      UI_DIST_PATH: "/app/client-ui/dist"
      OPPTRIX_WITH_MODELS: "${OPPTRIX_WITH_MODELS:-1}"
      OPPTRIX_FETCH_MODELS_ON_START: "${OPPTRIX_FETCH_MODELS_ON_START:-0}"
      OPPTRIX_SKIP_MODEL_FETCH: "${OPPTRIX_SKIP_MODEL_FETCH:-0}"
      OPPTRIX_MIRROR_AUTO: "${OPPTRIX_MIRROR_AUTO:-0}"
      OPPTRIX_FORCE_MODEL_FETCH: "${OPPTRIX_FORCE_MODEL_FETCH:-0}"
      OPPTRIX_MODEL_SOURCE_ORDER: "${OPPTRIX_MODEL_SOURCE_ORDER:-modelscope,hf-mirror,huggingface}"
      OPPTRIX_APP_VERSION: "${OPPTRIX_APP_VERSION:-}"
      OPPTRIX_RELEASE_CHANNEL: "${OPPTRIX_RELEASE_CHANNEL:-}"
      OPPTRIX_RELEASE_TAG: "${OPPTRIX_RELEASE_TAG:-}"
      OPPTRIX_BASE_VERSION: "${OPPTRIX_BASE_VERSION:-}"
    volumes:
      - opptrix-data:/data
      - opptrix-models:/models
      - opptrix-system:/system
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8711/api/health"]
      interval: 30s
      timeout: 8s
      retries: 8
      start_period: 180s

volumes:
  opptrix-data:
  opptrix-models:
  opptrix-system:
